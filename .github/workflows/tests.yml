name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y bubblewrap socat  # the chat sandbox; the wizard probe and the Codex engine expect them
      - run: pip install cryptography  # the push tests sign with it; the bot itself needs it only for Web Push
      - run: python3 -m unittest discover -s tests -q
      - run: bash -n deploy/setup.sh deploy/setup-macos.sh deploy/zidos-pager-tunnel.sh
