name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    strategy:
      matrix:
        include:
          - {arch: arm64, runner: macos-14}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/macos-app/build-dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: python deploy/windows/build-exe.py
      - name: Smoke test
        shell: bash
        run: |
          dist/zidos-pager-Setup-windows.exe --no-browser --port 18800 > wizard.log 2>&1 &
          pid=$!
          url=""
          for _ in $(seq 60); do
            url=$(grep -o 'http://127.0.0.1:[0-9]*/?t=[^ ]*' wizard.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { cat wizard.log; exit 1; }
          token="${url##*t=}"
          curl -fsS -H "X-Wizard-Token: $token" http://127.0.0.1:18800/api/state | tee state.json
          grep -q '"presets"' state.json
          kill "$pid" || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/zidos-pager-Setup-windows.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir dist
          git archive --prefix=zidos-pager/ -o dist/zidos-pager-linux.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/zidos-pager-linux.tar.gz
  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum zidos-pager-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" zidos-pager-* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" zidos-pager-* SHA256SUMS --generate-notes
          fi
