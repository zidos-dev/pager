<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Изменения за сутки</title>
<style>
/* Облик — токены мини-аппа (index.html): смысл цветов тот же; страница открывается вне Telegram, тема — по системе */
@font-face{font-family:"Onest";font-style:normal;font-weight:100 900;font-display:swap;src:url(/app/onest-cyrillic.woff2) format("woff2");unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:"Onest";font-style:normal;font-weight:100 900;font-display:swap;src:url(/app/onest-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --canvas:#f1f2f5; --panel:#ffffff; --ink:#111214; --muted:#6b7079; --link:#2f6fd6;
  --soft:color-mix(in srgb,var(--ink) 6%,var(--panel));
  --font:"Onest",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--canvas:#0f0f10;--panel:#1c1c1e;--ink:#f2f2f5;--muted:#a9a9b0;--link:#c4ef55;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.6px;margin:0}
.when{color:var(--muted);font-size:15px;margin:6px 0 20px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 28px}
.sum>*{background:var(--panel);border-radius:14px;padding:12px 12px 10px;color:inherit;text-decoration:none;min-height:44px;display:block}
.sum b{display:block;font-size:26px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.sum span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.25}
.sum .zero b{color:var(--muted)}
section{margin:0 0 28px;scroll-margin-top:16px}
h2{font-size:20px;line-height:1.2;font-weight:650;letter-spacing:-.3px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 .n{font-size:15px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{background:var(--panel);border-radius:var(--r);padding:12px 14px}
.subj{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.kind{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:7px;padding:1px 7px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
details{margin-top:0}
summary{font-size:13px;color:var(--link);cursor:pointer;min-height:44px;margin:-4px 0 -12px -14px;padding:0 14px;display:inline-flex;align-items:center;list-style:none;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
.files{margin:2px 0 0;padding:8px 10px;background:var(--soft);border-radius:10px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;color:var(--ink);white-space:pre-wrap}
.empty,.state{background:var(--panel);border-radius:var(--r);padding:16px;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.state button{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;padding:0 18px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:600 15px var(--font);cursor:pointer}
.sk{background:var(--panel);border-radius:var(--r);height:68px;margin-bottom:6px;opacity:.7}
@media (min-width:900px){ main{padding-top:56px} h1{font-size:34px} }
@media (max-width:360px){ .sum{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<main id="root" aria-busy="true">
  <h1>Изменения за сутки</h1>
  <p class="when" id="when">&nbsp;</p>
  <div class="sk"></div><div class="sk"></div><div class="sk"></div>
</main>
<script>
(function(){
"use strict";
const AREAS = [["site", "Сайт (UI/UX)", "Сайт"], ["data", "Прогнозы и данные", "Прогнозы и данные"], ["server", "Сервер", "Сервер"], ["other", "Прочее", "Прочее"]];
// тип коммита из префикса feat(v2): … — коротким словом; остальное — заголовок как есть
const KIND = {feat: "новое", fix: "исправление", perf: "скорость", refactor: "переработка", style: "оформление", docs: "документы", test: "тесты", chore: "служебное", ci: "сборка", build: "сборка", revert: "откат", data: "данные", ui: "интерфейс"};
const root = document.getElementById("root");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const hm = ts => new Date(ts * 1000).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
let endDay = "", manyAuthors = false;
const when = ts => new Date(ts * 1000).toDateString() === endDay ? new Date(ts * 1000).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}) : hm(ts);  // дата — только если не день отчёта

function state(title, text, retry){
  root.replaceChildren(el("h1", "", "Изменения за сутки"), el("p", "when", " "));
  const s = el("div", "state"); s.append(el("b", "", title), el("span", "", text));
  if (retry){ const b = el("button", "", "Обновить"); b.type = "button"; b.onclick = () => location.reload(); s.append(el("br"), b); }
  root.append(s);
  root.removeAttribute("aria-busy");
}
function commit(c){
  const li = el("li"), subj = el("div", "subj");
  const m = /^(\w+)(?:\(([^)]*)\))?!?:\s*(.+)$/.exec(String(c.subject || ""));
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (m && KIND[m[1].toLowerCase()]){ subj.append(el("span", "kind", KIND[m[1].toLowerCase()]), document.createTextNode(cap(m[3]))); }  // область (v2, odds) владельцу ничего не говорит
  else subj.textContent = cap(String(c.subject || ""));
  const meta = el("div", "meta"); meta.append(el("span", "", when(c.ts)));
  if (manyAuthors) meta.append(el("span", "", String(c.author || "")));  // один автор — не повторять в каждой строке
  li.append(subj, meta);
  const files = Array.isArray(c.files) ? c.files : [];
  if (files.length){
    const d = el("details"), sm = el("summary", "", files.length + " " + plural(files.length, "файл", "файла", "файлов"));
    d.append(sm, el("div", "files", files.join("\n")));
    li.append(d);
  }
  return li;
}
function render(r){
  const commits = Array.isArray(r.commits) ? r.commits : [];
  endDay = new Date(r.until * 1000).toDateString(); manyAuthors = new Set(commits.map(c => c.author)).size > 1;
  root.replaceChildren(el("h1", "", "Изменения за сутки"), el("p", "when", hm(r.since) + " — " + hm(r.until)));
  const counts = r.counts || {};
  const sum = el("nav", "sum"); sum.setAttribute("aria-label", "Разделы");
  for (const [k, , short] of AREAS){
    const n = counts[k] != null ? counts[k] : commits.filter(c => c.area === k).length;
    const a = el(n ? "a" : "div", n ? "" : "zero"); if (n) a.href = "#" + k;  // пустой раздел не рисуется — и ссылки на него нет
    a.append(el("b", "", String(n)), el("span", "", short)); sum.append(a);
  }
  root.append(sum);
  if (!commits.length){ root.append(el("div", "empty", "За эти сутки в проекте ничего не менялось.")); root.removeAttribute("aria-busy"); return; }
  for (const [k, title] of AREAS){
    const list = commits.filter(c => (AREAS.some(a => a[0] === c.area) ? c.area : "other") === k);
    if (!list.length) continue;
    const s = el("section"); s.id = k;
    const h = el("h2", "", title); h.append(el("span", "n", String(list.length))); s.append(h);
    const ol = el("ol"); list.forEach(c => ol.append(commit(c))); s.append(ol); root.append(s);
  }
  root.removeAttribute("aria-busy");
}
const token = (location.pathname.match(/^\/r\/([^/.]+)\/?$/) || [])[1];
if (!token){ state("Нет такого отчёта", "Откройте ссылку из чата целиком."); return; }
fetch("/r/" + encodeURIComponent(token) + ".json", {cache: "no-store"}).then(res => {
  if (res.status === 404){ state("Ссылка устарела", "Отчёт хранится 7 дней. Напишите «отчёт» в чате — бот пришлёт новую ссылку."); return; }
  if (!res.ok) throw new Error(res.status);
  return res.json().then(render);
}).catch(() => state("Не удалось загрузить отчёт", "Проверьте связь и попробуйте ещё раз.", true));
})();
</script>
</body>
</html>
